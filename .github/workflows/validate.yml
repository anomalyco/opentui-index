name: Validate packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout package index
        uses: actions/checkout@v6
      - name: Checkout OpenTUI
        uses: actions/checkout@v6
        with:
          repository: anomalyco/opentui
          path: opentui
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: opentui
      - name: Validate packages
        run: bun scripts/validate-packages.ts "$GITHUB_WORKSPACE/packages" --network
        working-directory: opentui/packages/web
