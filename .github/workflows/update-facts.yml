name: Update package facts

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-package-facts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout package index
        uses: actions/checkout@v6
      - name: Checkout OpenTUI
        uses: actions/checkout@v6
        with:
          repository: anomalyco/opentui
          path: opentui
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: opentui
      - name: Update package facts
        run: bun scripts/update-package-facts.ts "$GITHUB_WORKSPACE/packages"
        working-directory: opentui/packages/web
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Validate package facts
        run: bun scripts/validate-packages.ts "$GITHUB_WORKSPACE/packages"
        working-directory: opentui/packages/web
      - name: Commit changes
        run: |
          git add packages/facts.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "update package facts"
          git push
